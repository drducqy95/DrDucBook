[project]
name = "nmt-onnx"
version = "0.1.0"
description = "HachimiMT PyTorch to ONNX export and quantization pipeline for Legado"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "optimum[onnxruntime]>=1.19.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxruntime-extensions>=0.11.0",
    "sacrebleu>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
